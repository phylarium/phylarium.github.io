# Atoms for the periodic table. The game loads this file; edit it and reload.
#
# Fields:
#   id      element symbol
#   name, how   shown in the periodic table once found
#   comet   carried by comets, one chemical per comet: weight (how often, against the other comet atoms), color
#           of its tail, and what the ice is. Real comets are mostly water ice, then carbon monoxide and dioxide,
#           a little ammonia. The atom is found when the comet crashes (discover, main.js onCometTap).
# When an atom is found otherwise is code: ATOM_FOUND in game.js. What a comet's atom does on impact: COMET_HIT.

- id: H
  name: Hydrogen
  how: The sun is a ball of hydrogen. Each tap squeezes its core hotter.
  comet: { weight: 2, color: '#ffffff', ice: hydrogen }

- id: He
  name: Helium
  how: 'Ignition: the sun fuses hydrogen into helium.'

- id: C
  name: Carbon
  how: Breathed out by the first eruptions, as carbon dioxide; comets brought more as frozen carbon monoxide.
  comet: { weight: 3, color: '#b0b0b0', ice: carbon monoxide }

- id: 'N'
  name: Nitrogen
  how: Crashed in with a comet, as frozen ammonia.
  comet: { weight: 2, color: '#5a8aff', ice: ammonia }

- id: O
  name: Oxygen
  how: Vented by the first eruptions, in steam and carbon dioxide; comets brought more as water ice.
  comet: { weight: 4, color: '#8ad8ff', ice: water }

- id: Ne
  name: Neon
  how: A noble gas in the air.

- id: Na
  name: Sodium
  how: 'The sea is salty: sodium chloride.'

- id: Mg
  name: Magnesium
  how: Chlorophyll has magnesium at its heart.

- id: Al
  name: Aluminium
  how: Light crust rock floats on the mantle.

- id: Si
  name: Silicon
  how: Lava is molten silicate rock.

- id: P
  name: Phosphorus
  how: Every cell copies itself on a phosphate backbone.

- id: S
  name: Sulfur
  how: Eruptions throw sulfur high into the air.

- id: Cl
  name: Chlorine
  how: 'The sea is salty: sodium chloride.'

- id: Ar
  name: Argon
  how: A noble gas, made as potassium in the rocks decays.

- id: K
  name: Potassium
  how: Soil feeds plants potassium.

- id: Ca
  name: Calcium
  how: Corals build with calcium carbonate.

- id: Fe
  name: Iron
  how: The spinning core is iron. It makes the magnetic field.

- id: Ni
  name: Nickel
  how: Mixed into the iron core.

- id: Cu
  name: Copper
  how: Arthropod blood is blue with copper.

- id: Kr
  name: Krypton
  how: A noble gas in the air.

- id: Xe
  name: Xenon
  how: A noble gas in the air.

- id: Rn
  name: Radon
  how: A radioactive noble gas seeping from the rocks.

- id: Au
  name: Gold
  how: Gold is forged when giant stars blow apart. Every grain on the planet came from a supernova.

- id: U
  name: Uranium
  how: Radon comes from uranium decaying in the rocks.
