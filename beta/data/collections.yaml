# Collections. A collection opens the first time one of its items is found: a banner says "New collection"
# and its section shows in the book. How an item is found is code (see collect and its callers): bands by
# tapping their shimmer (BAND_GLIMMER, once Rainbow is gained), glows by tapping auroras (GLOW_IN_AIR), grasses
# by planting seeds, fish by tracing rivers, flowers in a superbloom, meteorites after a meteor shower, lights
# on glowing nights, comets by catching comets. The ultras themselves are cards in the Ultras deck (book.js).
# A full set brings a big reward (in the code, by collection id).
# The game loads this file; edit it and reload.
#
# Fields:
#   id, name      id is used in code and saves
#   section       book section it shows in (see book.yaml)
#   ultra         the ultra of the story it belongs to, if any (for the wiki; it does not gate the collection)
#   full          what the full set does, in words (the effect itself is code, see setDone in game.js)
#   items         id, name, sign (short text on the card), color (optional), how; `zone` for grasses: the climate it grows in

- id: bands
  name: Beyond the rainbow
  section: bands
  ultra: rainbow
  full: Lets the planet be seen in infrared.
  items:
    - { id: radio, name: Radio waves, sign: "1 m", how: "Lightning crackles with radio waves as well as light." }
    - { id: microwave, name: Microwaves, sign: "1 mm", how: "The afterglow of the Big Bang still fills the whole night sky, cooled to microwaves." }
    - { id: infrared, name: Infrared, sign: "10 µm", how: "Hot lava glows with heat you can feel but not see." }
    - { id: ultraviolet, name: Ultraviolet, sign: "300 nm", how: "The sun shines beyond violet. It burns skin and breaks DNA." }
    - { id: xray, name: X-rays, sign: "1 nm", how: "A solar flare blasts out X-rays. The air stops them high up." }
    - { id: gamma, name: Gamma rays, sign: "1 pm", how: "A dying star far away explodes, and for a moment outshines its whole galaxy." }

- id: glows
  name: Glowing gases
  section: glow
  ultra: aurora
  full: The ozone layer forms fully at 1.5% oxygen instead of 2%.
  items:
    - { id: oxygenGreen, name: Oxygen, green, sign: "558 nm", color: '#6aff9a', how: "Oxygen atoms about 100 km up, hit by particles from the sun, glow green. Most auroras are this color." }
    - { id: oxygenRed, name: Oxygen, red, sign: "630 nm", color: '#ff5a4a', how: "Higher up, above 200 km, the thin oxygen glows deep red, crowning strong auroras." }
    - { id: nitrogen, name: Nitrogen, sign: "428 nm", color: '#b07aff', how: "Nitrogen glows blue and purple along the lower edge of an aurora." }
    - { id: neon, name: Neon, sign: "640 nm", color: '#ff8a3a', how: "In a glowing tube neon shines red-orange. In the air there is too little of it to see." }
    - { id: argon, name: Argon, sign: "420 nm", color: '#c08aff', how: "Argon glows lavender, and is the third most common gas in the air." }
    - { id: krypton, name: Krypton, sign: "587 nm", color: '#f0f0ff', how: "Krypton glows a soft white, rare in the air but bright in a tube." }

- id: grasses
  name: Wild grasses
  section: grasses
  ultra: richsoil
  full: Droughts no longer dry out the land.
  items:
    - { id: wheat, name: Wild wheat, sign: Einkorn, color: '#e0c080', zone: moist, how: 'Einkorn, a wild grass of dry hills, was the first wheat people would sow.' }
    - { id: rice, name: Wild rice, sign: Oryza, color: '#c8e0a0', zone: wet, how: 'A grass of warm swamps, its seeds ripen standing in water.' }
    - { id: teosinte, name: Teosinte, sign: Zea, color: '#ffd23f', zone: dry, how: 'A bushy grass with a few hard seeds, the wild ancestor of maize.' }
    - { id: barley, name: Wild barley, sign: Hordeum, color: '#d8b870', zone: cold, how: 'Tough enough for cool, short summers.' }
    - { id: millet, name: Wild millet, sign: Panicum, color: '#c8884a', zone: dry, how: 'Ripens fast in heat and drought.' }

- id: flowers
  name: Flowers and pollinators
  section: flowers
  ultra: superbloom
  full: Droughts last half as long.
  items:
    - { id: poppy, name: Poppy, sign: bee, color: '#ff5a4a', how: 'Opens wide and red in the sun; bees roll in its pollen.' }
    - { id: lupine, name: Lupine, sign: bumblebee, color: '#7a8aff', how: 'Only a heavy bumblebee can push its petals open.' }
    - { id: primrose, name: Evening primrose, sign: moth, color: '#fff0a0', how: 'Opens pale at dusk for night-flying moths.' }
    - { id: lily, name: Desert lily, sign: hawkmoth, color: '#f0f0ff', how: 'Waits years as a bulb, then flowers after rare rain.' }
    - { id: sunflower, name: Sunflower, sign: beetle, color: '#ffb43a', how: 'Turns with the sun; beetles crawl over its broad head.' }

- id: fish
  name: River fish
  section: fish
  ultra: delta
  full: Rivers wash twice the minerals to the sea.
  items:
    - { id: salmon, name: Salmon, sign: Salmo, color: '#ff8a8a', how: 'Born in a stream, grows up at sea, and swims back up to spawn where it hatched.' }
    - { id: eel, name: Eel, sign: Anguilla, color: '#8a9a78', how: 'Swims the other way: grows up in rivers, spawns far out at sea.' }
    - { id: catfish, name: Catfish, sign: Silurus, color: '#a8a090', how: 'Feels its way through muddy water with its whiskers.' }
    - { id: sturgeon, name: Sturgeon, sign: Acipenser, color: '#7a8a9a', how: 'An armored giant of big rivers, older than the dinosaurs.' }
    - { id: pike, name: Pike, sign: Esox, color: '#6aa86a', how: 'Waits still among the reeds, then strikes in a flash.' }

- id: meteorites
  name: Meteorites
  section: meteorites
  ultra: meteors
  full: Solar storms burn surface life a third as much.
  items:
    - { id: iron, name: Iron meteorite, sign: Fe, color: '#9a9aa8', how: 'Almost pure iron and nickel from the core of a broken little planet. The first iron people worked fell from the sky.' }
    - { id: chondrite, name: Chondrite, sign: rock, color: '#8a7a6a', how: 'Stone full of tiny beads, unchanged since the planets formed.' }
    - { id: pallasite, name: Pallasite, sign: olivine, color: '#a8c860', how: 'Green olivine crystals set in iron, from where a core met its mantle.' }
    - { id: carbonaceous, name: Carbonaceous, sign: C, color: '#3a3a40', how: 'Dark and crumbly, rich in water and carbon, even amino acids.' }
    - { id: iridium, name: Iridium dust, sign: Ir, color: '#d0d0e0', how: 'A metal rare on the ground and common in space: a thin layer of it marks a great impact.' }

- id: lights
  name: Lights of the sea
  section: lights
  ultra: biolum
  full: Ocean life makes 25% more DNA.
  items:
    - { id: seasparkle, name: Sea sparkle, sign: Noctiluca, color: '#5ad8ff', how: 'A one-celled plankton that flashes blue when the water moves: the glow in breaking waves.' }
    - { id: combjelly, name: Comb jelly, sign: ctenophore, color: '#b07aff', how: 'Rows of beating hairs scatter light into running rainbows, and some glow blue as well.' }
    - { id: fireflysquid, name: Firefly squid, sign: Watasenia, color: '#3a8aff', how: 'Thumb-sized squid that rise to the shore in spring and light the bays with blue dots.' }
    - { id: lanternfish, name: Lanternfish, sign: Myctophidae, color: '#8ad8ff', how: 'Lights along its belly hide its shadow from hunters below.' }
    - { id: anglerfish, name: Anglerfish, sign: Lophiiformes, color: '#6aff9a', how: 'A glowing lure on its head draws prey through the dark deep sea.' }


- id: comets
