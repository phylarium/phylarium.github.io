  name: Gems of the plates
  section: gems
  ultra: drift
  gates: drift
  full: Opens Continental Drift.
  items:
    - { id: ruby, name: Ruby, sign: Al₂O₃, icon: gemRuby, color: '#d83a4a', how: 'Corundum turned red by chromium, baked where India crashed into Asia. (Al₂O₃)' }
    - { id: sapphire, name: Sapphire, sign: Al₂O₃, icon: gemSapphire, color: '#3a6ad8', how: 'The same corundum as ruby, blue from iron and titanium. (Al₂O₃)' }
    - { id: garnet, name: Garnet, sign: Silicate, icon: gemGarnet, color: '#a02a3a', how: 'Grows in rock squeezed and heated deep under colliding mountains. (Silicate)' }
