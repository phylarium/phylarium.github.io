    - { id: cactus, name: Cacti, icon: spCactus, how: 'Water stored in the stem, leaves turned into spines.' }
    - { id: fungi, name: Fungi, icon: spFungi, how: 'Threads under the ground that eat what dies.' }
    - { id: lichen, name: Lichens, icon: spLichen, how: 'A fungus and an alga living as one, the first to cover bare rock.' }
    - { id: mushroom, name: Mushrooms, icon: spMushroom, how: 'The fruit of a fungus. The fungus itself is the hidden web below.' }
    - { id: seagrass, name: Seagrass, icon: spSeagrass, how: 'Flowering plants that went back to the sea: green meadows in the shallows.' }
    - { id: mangrove, name: Mangroves, icon: spMangrove, how: 'Trees on stilts in salty mud, where rivers meet the sea.' }
    - { id: palm, name: Palms, icon: spPalm, how: 'One tall stem and a crown of huge leaves, in the warm and the wet.' }
    - { id: orchid, name: Orchids, icon: spOrchid, how: 'The biggest family of flowers, many made to fool one kind of bee.' }
