    - { id: bamboo, name: Bamboo, icon: spBamboo, how: 'A grass that grows into a forest, up to a meter a day.' }
    - { id: saguaro, name: Saguaros, icon: spSaguaro, how: 'Cactus giants with raised arms that live two hundred years.' }
    - { id: reindeerlichen, name: Reindeer Lichen, icon: spReindeerLichen, how: 'Pale grey tufts on the tundra, winter food for whole herds.' }
    - { id: slimemould, name: Slime Moulds, icon: spSlime, how: 'Neither plant nor fungus: a yellow web of cells that crawls the forest floor and solves mazes.' }

