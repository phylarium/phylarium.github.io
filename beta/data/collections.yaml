# A card poster of its own (not a layer of The Moon): the card posters, Star signs, Moon phases and Famous comets,
# are the long collections that open an ultra, kept apart on purpose (2026-11-09).
- id: phases
  name: Moon phases
  section: phases
  night: true
  ultra: eclipse
  gates: eclipse
  full: Opens Eclipse.
  items:
    - { id: newmoon, name: New moon, sign: 🌑, icon: moonNew, how: 'The moon sits between the planet and the sun: its lit side faces away, and it hides in the glare.' }
    - { id: waxcrescent, name: Waxing crescent, sign: 🌒, icon: moonWaxCrescent, how: 'A thin sliver at dusk, growing a little each night.' }
    - { id: firstquarter, name: First quarter, sign: 🌓, icon: moonFirstQuarter, how: 'Half lit: a quarter of the way round its orbit.' }
    - { id: waxgibbous, name: Waxing gibbous, sign: 🌔, icon: moonWaxGibbous, how: 'More than half and still growing.' }
    - { id: fullmoon, name: Full moon, sign: 🌕, icon: moonFull, how: 'Opposite the sun, the whole face is lit, rising as the sun sets.' }
    - { id: wangibbous, name: Waning gibbous, sign: 🌖, icon: moonWanGibbous, how: 'Past full, shrinking from the other side.' }
    - { id: lastquarter, name: Last quarter, sign: 🌗, icon: moonLastQuarter, how: 'Half lit again, the other half, rising around midnight.' }
    - { id: wancrescent, name: Waning crescent, sign: 🌘, icon: moonWanCrescent, how: 'A last sliver before dawn, before the moon goes dark again.' }
