    - { id: diamond, name: Diamond, sign: C, icon: trDiamond, color: '#e8f4ff', how: 'Carbon squeezed 150 km down, carried up fast by the deepest eruptions, through pipes of kimberlite. (C)' }
    - { id: geode, name: Geode, sign: SiO₂, icon: trGeode, color: '#b07aff', how: 'A gas bubble in cooled lava, slowly lined with crystals by water seeping through. (SiO₂)' }
    - { id: amethyst, name: Amethyst, sign: SiO₂, icon: trAmethyst, color: '#9a5ad8', how: 'Quartz turned purple by a trace of iron, often grown inside geodes. (SiO₂)' }
    - { id: obsidian, name: Obsidian, sign: Glass, icon: trObsidian, color: '#2a2430', how: 'Lava that cooled too fast to grow crystals: natural glass, sharp enough for the first knives. (Glass)' }
    - { id: peridot, name: Peridot, sign: Olivine, icon: trPeridot, color: '#9ad83a', how: 'The gem form of olivine, the green mineral of the mantle, brought up in lava. (Olivine)' }
    - { id: opal, name: Opal, sign: SiO₂·nH₂O, icon: trOpal, color: '#c8e8f0', how: 'Silica jelly from water in volcanic rock, set into tiny spheres that split light into colors. (SiO₂·nH₂O)' }

