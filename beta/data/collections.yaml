# Collections. A collection opens the first time one of its items is found, and its card set shows on its page of
# the book. How an item is found is code (see collect and its callers): bands by
# tapping their shimmer (BAND_GLIMMER, once Rainbow is gained), glows by tapping auroras (GLOW_IN_AIR), flowers in
# a superbloom, meteorites after a meteor shower, lights on glowing nights, comets by catching comets.
# A full set brings a big reward (in the code, by collection id).
# The game loads this file; edit it and reload.
#
# Fields:
#   id, name      id is used in code and saves
#   section       its card set's section id (see book.yaml)
#   opens         a card that opens its section before anything is found (the bands: Rainbow opens the wave game)
#   card          the card that develops it: once that card is developed, the set shows inside the card's frame
#                 (addons.js) instead of as a part of the page with a heading of its own
#   ultra         the ultra of the story it belongs to, if any (for the wiki)
#   gates         the ultra this set opens: that ultra needs `set <id>` (check-data makes sure)
#   full          what the full set does, in words (the effect itself is code, see setDone in game.js)
#   splash        the heading of a splash that names each item as it is found (the gemstones); none when left out
#   night         true: a dark card poster (the night sky) instead of cream paper (posters say so themselves)
#   art           a card poster drawn in layers instead: the folder posters/<art>/ with one picture per item
#   items         id, name, sign (short text on the card), icon (optional sprite shown instead of the sign), color (optional), how

- id: colors
  name: Spectrum
  section: colors
  ultra: rainbow
  gates: rainbow
  full: Opens Rainbow.
  items:
    - { id: red, name: Red, sign: '●', color: '#d83a2a', how: 'The burning sun, and glowing lava: the longest waves the eye can see. (620–750 nm)' }
    - { id: orange, name: Orange, sign: '●', color: '#ff8a1a', how: 'The burning sun, and a comet burning up as it falls through the air. (590–620 nm)' }
    - { id: yellow, name: Yellow, sign: '●', color: '#ffd23f', how: 'The sun, once it burns. (570–590 nm)' }
    - { id: green, name: Green, sign: '●', color: '#4aa84a', how: 'Life that makes food from light reflects the green it does not use. (495–570 nm)' }
    - { id: blue, name: Blue, sign: '●', color: '#3a6ad8', how: 'Air thick enough to scatter sunlight: short blue waves scatter most. (450–495 nm)' }
    - { id: violet, name: Violet, sign: '●', color: '#b07aff', how: 'The glow of lightning: the shortest waves the eye can see. (380–450 nm)' }

- id: bands
  name: Beyond the rainbow
  section: bands
  opens: rainbow
  ultra: rainbow
  full: Lets the planet be seen in infrared.
  items:
    - { id: radio, name: Radio waves, sign: "1 m", how: "Lightning crackles with radio waves as well as light." }
    - { id: microwave, name: Microwaves, sign: "1 mm", how: "The afterglow of the Big Bang still fills the whole night sky, cooled to microwaves." }
    - { id: infrared, name: Infrared, sign: "10 µm", how: "Hot lava glows with heat you can feel but not see." }
    - { id: ultraviolet, name: Ultraviolet, sign: "300 nm", how: "The sun shines beyond violet. It burns skin and breaks DNA." }
    - { id: xray, name: X-rays, sign: "1 nm", how: "A solar flare blasts out X-rays. The air stops them high up." }
    - { id: gamma, name: Gamma rays, sign: "1 pm", how: "A dying star far away explodes, and for a moment outshines its whole galaxy." }

- id: glows
  name: Glowing gases
  section: glows
  card: aurora
  ultra: aurora
  gates: aurora
  full: Opens Aurora, and the ozone layer forms fully at 1.5% oxygen instead of 2%.
  items:
    - { id: oxygenGreen, name: Oxygen, green, sign: "558 nm", color: '#6aff9a', how: "Oxygen atoms about 100 km up, hit by particles from the sun, glow green. Most auroras are this color." }
    - { id: oxygenRed, name: Oxygen, red, sign: "630 nm", color: '#ff5a4a', how: "Higher up, above 200 km, the thin oxygen glows deep red, crowning strong auroras." }
    - { id: nitrogen, name: Nitrogen, sign: "428 nm", color: '#b07aff', how: "Nitrogen glows blue and purple along the lower edge of an aurora." }
    - { id: neon, name: Neon, sign: "640 nm", color: '#ff8a3a', how: "In a glowing tube neon shines red-orange. In the air there is too little of it to see." }
    - { id: argon, name: Argon, sign: "420 nm", color: '#c08aff', how: "Argon glows lavender, and is the third most common gas in the air." }
    - { id: krypton, name: Krypton, sign: "587 nm", color: '#f0f0ff', how: "Krypton glows a soft white, rare in the air but bright in a tube." }

# Research first, then the world: once Rocks is developed, an eruption now and then leaves a rock glinting in the
# fresh ground (see erupt in play.js); the set shows inside the Rocks card.
- id: rocks
  name: Volcanic rocks
  section: rocks
  card: rock
  gates: richsoil
  full: Opens Rich Soil.
  items:
    - { id: basalt, name: Basalt, sign: Lava, icon: rockBasalt, color: '#4a4a56', how: 'Dark lava that cooled at the surface. Most of the ocean floor is basalt.' }
    - { id: obsidian, name: Obsidian, sign: Glass, icon: trObsidian, color: '#2a2430', how: 'Lava that cooled too fast to grow crystals: natural glass, sharp enough for the first knives.' }
    - { id: pumice, name: Pumice, sign: Foam, icon: rockPumice, color: '#f0f0f0', how: 'Lava frothed with gas and frozen as foam: a rock so full of holes that it floats on water.' }
    - { id: tuff, name: Tuff, sign: Ash, icon: rockTuff, color: '#c8a070', how: 'Volcanic ash that settled and hardened into soft rock. The statues of Easter Island are carved from it.' }
    - { id: granite, name: Granite, sign: Deep, icon: rockGranite, color: '#f0a0d0', how: 'Magma that cooled slowly deep underground, so its crystals grew large enough to see. The continents are built on it.' }
    - { id: geode, name: Geode, sign: SiO₂, icon: trGeode, color: '#b07aff', how: 'A gas bubble in cooled lava, slowly lined with crystals by water seeping through. (SiO₂)' }

# Once Gemstones is developed, an earthquake leaves gems glinting where the ground split open (gemTick in play.js);
# the set shows inside the Gemstones card. The fourteen are the user's list (2026-11-16).
- id: gems
  name: Gemstones
  section: gems
  card: gemstone
  splash: Gemstone Found!
  ultra: drift
  gates: drift
  full: Opens Continental Drift.
  items:
    - { id: diamond, name: Diamond, sign: C, icon: gemDiamond, color: '#e8f4ff', how: 'Carbon squeezed 150 km down and carried up fast by the deepest eruptions. The hardest natural material. (C)' }
    - { id: ruby, name: Ruby, sign: Al₂O₃, icon: gemRuby, color: '#d83a4a', how: 'Corundum turned red by chromium, baked where India crashed into Asia. (Al₂O₃)' }
    - { id: sapphire, name: Sapphire, sign: Al₂O₃, icon: gemSapphire, color: '#3a6ad8', how: 'The same corundum as ruby, blue from iron and titanium. (Al₂O₃)' }
    - { id: emerald, name: Emerald, sign: Beryl, icon: gemEmerald, color: '#2ac87a', how: 'Beryl turned green by chromium, grown from hot fluids where mountains rose. (Beryl)' }
    - { id: amethyst, name: Amethyst, sign: SiO₂, icon: gemAmethyst, color: '#9a5ad8', how: 'Quartz turned purple by a trace of iron, often grown inside geodes. (SiO₂)' }
    - { id: aquamarine, name: Aquamarine, sign: Beryl, icon: gemAquamarine, color: '#8ad8ff', how: 'The same beryl as emerald, turned sea-blue by iron. (Beryl)' }
    - { id: opal, name: Opal, sign: SiO₂·nH₂O, icon: gemOpal, color: '#c8e8f0', how: 'Silica jelly from water in volcanic rock, set into tiny spheres that split light into colors. (SiO₂·nH₂O)' }
    - { id: pearl, name: Pearl, sign: CaCO₃, icon: gemPearl, color: '#f0f0f0', how: 'Not a mineral: an oyster or mussel coats a grain inside its shell with layer upon layer of nacre. (CaCO₃)' }
    - { id: amber, name: Amber, sign: Resin, icon: gemAmber, color: '#ff8a1a', how: 'Not a mineral either: tree resin hardened over millions of years, sometimes with an insect caught inside. (Resin)' }
    - { id: turquoise, name: Turquoise, sign: Phosphate, icon: gemTurquoise, color: '#7af0a0', how: 'Grows in dry land where water seeps through rock rich in copper, which makes it blue-green. (Phosphate)' }
    - { id: jade, name: Jade, sign: Jadeite, icon: gemJade, color: '#4aa86a', how: 'Formed under high pressure but low heat, where one plate dives under another. (Jadeite)' }
    - { id: topaz, name: Topaz, sign: Silicate, icon: gemTopaz, color: '#ffd23f', how: 'Grows from the last fluids of cooling granite. Clear when pure; traces turn it yellow or blue. (Silicate)' }
    - { id: garnet, name: Garnet, sign: Silicate, icon: gemGarnet, color: '#a02a3a', how: 'Grows in rock squeezed and heated deep under colliding mountains. (Silicate)' }
    - { id: tourmaline, name: Tourmaline, sign: Borosilicate, icon: gemTourmaline, color: '#f0a0d0', how: 'Grows in cooling granite in almost any color; one crystal can be pink at one end and green at the other. (Borosilicate)' }

# A snowflake's shape is set by the temperature of the air it grows in (Ukichiro Nakaya's diagram). Tapping a
# snowing cloud finds the shape for the air under it (`temp`: from, to in °C, at the cloud).
- id: snowflakes
  name: Snowflakes
  section: snowflakes
  card: snow
  ultra: delta
  gates: delta
  full: Opens Fertile Delta.
  items:
    - { id: plate, name: Hexagonal plate, sign: '0 to −4 °C', icon: flakePlate, color: '#e8f4ff', temp: [-4, 0], how: 'Just below freezing, ice grows as thin six-sided plates. (0 to −4 °C)' }
    - { id: needle, name: Needle, sign: '−4 to −6 °C', icon: flakeNeedle, color: '#e8f4ff', temp: [-6, -4], how: 'A little colder, the crystal grows long and thin instead. (−4 to −6 °C)' }
    - { id: column, name: Hollow column, sign: '−6 to −10 °C', icon: flakeColumn, color: '#e8f4ff', temp: [-10, -6], how: 'Six-sided columns, often hollow at the ends, like tiny pencils. (−6 to −10 °C)' }
    - { id: sectored, name: Sectored plate, sign: '−10 to −13 °C', icon: flakeSectored, color: '#e8f4ff', temp: [-13, -10], how: 'Plates again, now with ridges that divide them into six sectors. (−10 to −13 °C)' }
    - { id: dendrite, name: Stellar dendrite, sign: '−13 to −18 °C', icon: flakeDendrite, color: '#e8f4ff', temp: [-18, -13], how: 'The classic six-armed star, branching fast in moist air near −15 °C. No two alike. (−13 to −18 °C)' }
    - { id: rosette, name: Bullet rosette, sign: 'below −18 °C', icon: flakeRosette, color: '#e8f4ff', temp: [-80, -18], how: 'In very cold, high clouds, columns sprout from one frozen drop like a burst. (below −18 °C)' }

