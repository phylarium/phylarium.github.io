# Then Comets lets comets come and Wandering Stars shows the planets. The star signs (the zodiac) are found once
# Eclipse, the Moonlight story's ultra-research, is gained: eclipses happen only along the zodiac's band.

- id: starlight
  name: Starlight
  icon: star
  tab: stars
  days: 0.5

- id: cometsight
  name: Comets
  icon: comet
  tab: stars
  requires: [starlight]
  needs: [days 3]
  days: 1

- id: wanderers
  name: Wandering Stars
  icon: wanderer
  tab: stars
  requires: [starlight]
  needs: [night]
  days: 2

