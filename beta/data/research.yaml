# ======== Chemistry › Molecules ========
# Each needs enough of its atoms, brought down by comets, and opens the gas it makes.

- id: mN2
  name: N₂
  icon: flask
  tab: molecules
  needs: [matter N 2]
  days: 0.5

- id: mCH4
  name: CH₄
  icon: flask
  tab: molecules
  needs: [matter C 3, matter H 3]
  days: 0.5

- id: mH2O
  name: H₂O
  icon: flask
  tab: molecules
  needs: [matter H 4, matter O 3]
  days: 0.5

- id: mCO2
  name: CO₂
  icon: flask
  tab: molecules
  needs: [matter C 6, matter O 6]
  days: 1

- id: mO2
  name: O₂
  icon: flask
  tab: molecules
  after: cells
  requires: [mH2O]
  days: 1

- id: mO3
  name: O₃
  icon: flask
