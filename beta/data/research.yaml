# ======== Science › Noble gases ========
# They react with nothing, so they do nothing to the climate. Each can exist as gas above its boiling point.
# Helium (uranium decay) and argon (potassium decay) come out with volcanic gas; radon seeps from moving crust
# and decays within days; neon, krypton and xenon arrive with comets and just stay. Helium escapes to space
# about as fast as decaying rock makes it; argon-40 builds up to about 0.93% of the air; radon has a 3.8-day half-life.

- id: helium
  name: Helium
  icon: gasHelium
  tab: noble
  hidden: true
  needs: [temp -269, done volcano]
  days: 0.5

- id: neon
