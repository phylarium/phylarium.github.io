  days: 0.5

- id: colorViolet
  name: Violet
  icon: lightViolet
  tab: spectrum
  requires: [starlight]
  needs: [strikes 10]
  days: 0.5

- id: colorGreen
  name: Green
  icon: lightGreen
  tab: spectrum
  requires: [starlight]
  needs: [evolved cyano]
  days: 0.5

# Raindrops split sunlight into every color at once: it needs all of them, rain and the sun in the sky.
# The ultra-research of the water cycle: it comes after the storm, once Thunderstorms has unlocked its disaster.
- id: rainbow
  name: Rainbow
  icon: rainbow
  tab: spectrum
  ultra: true
  puzzle: spectrum
  after: thaw
  requires: [storms, colorYellow, colorRed, colorOrange, colorBlue, colorViolet, colorGreen]
  needs: [disaster thunderstorm, done rain, clouds 10, daytime]
  days: 1

