# ======== Biology › Land life ========
# Biomes: where each can grow depends on the local climate, so they shift as the planet warms or cools.
# Deserts spread in the heat and cut land life. Deep roots reach water far down and hold the soil.

- id: soil
  name: Soil
  icon: plant
  tab: landlife
  after: ozone
  needs: [plants 1, done rivers]
  days: 2
  dnaMult: {ground: 2}

- id: grass
  name: Grasslands
  icon: plant
  tab: landlife
  after: ozone
  requires: [soil]
  needs: [plants 2]
  days: 2
  dnaMult: {ground: 1.5}

- id: forests
  name: Forests
  icon: tree
  tab: landlife
  after: ozone
  requires: [grass]
  needs: [plants 3]
  days: 3
  dnaMult: {ground: 1.5}

- id: wetlands
  name: Wetlands
  icon: plant
  tab: landlife
  after: ozone
  requires: [soil]
  needs: [done lakes, temp 5]
  days: 2
  dnaMult: {ground: 1.5}

- id: roots
  name: Deep Roots
  icon: plant
  tab: landlife
  after: ozone
  requires: [forests]
  needs: [desert 15, plants 2]
  days: 3

