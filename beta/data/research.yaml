# The research tree. The game loads this file; edit it and reload.
#
# Each node shows only its name and what it needs until researched, then a gauge (set in game.js, RESEARCH_CODE).
# A node appears in its book tab once everything in `requires` is researched and its `after` event has happened.
# It can be researched once every condition in `needs` holds; the player chooses when. Research takes `days`
# game days, one node at a time. `replaces` hides the earlier node of a chain.
#
# Fields:
#   id, name      id is used in code and saves: never change a released id
#   icon          sprite name from sprites.js
#   tab           book section it shows in (see book.yaml)
#   after         event that must have happened: sunlit, thaw, ocean, storms, life, cells, ozone, flight
#   requires      research ids that must be done first (the chain inside a story)
#   needs         conditions, each "kind value":
#                   temp °C, sunAge billion years, spin %, days, air bar, water % open, clouds %, strikes,
#                   eruptions, land %, mountains %, minerals, species, desert %, plants, comets, oxygen %,
#                   planets, signs, matter ATOM COUNT (comet atoms), done RESEARCH_ID (link to another branch)
#   days          research time in game days
#   replaces      id of the node this one supersedes
#
# What a node does once researched (a number here, or a function in RESEARCH_CODE):
#   sun, volcanoes, eruptionSize, lightning       the highest among researched nodes wins
#   minerals, ch4, cloudRate, albedo, iceShift    added up (per second, or share of sunlight, or °C)
#   cloudMult, rainMult, boltMult, weatherMult, dieOff, landMult   multiplied together
#   dnaMult       DNA multiplier per domain: {ocean, ground, atmosphere} or {all}
# Code-only parts (gauge, tick, climax) live in game.js under RESEARCH_CODE, by id.

# ======== Astronomy › Sun ========
# The sun brightens as it ages, as the real sun did (70% of today's light at birth).

- id: sun1
  name: Sunlight
  icon: sunicon
  tab: sun
  after: sunlit
  needs: [sunAge 0.5]
  days: 1
  sun: 0.78

- id: sun2
  name: Brighter Sun
  icon: sunicon
  tab: sun
  after: sunlit
  requires: [sun1]
  replaces: sun1
  needs: [sunAge 1.5]
  days: 1
  sun: 0.86

- id: sun3
  name: Main Sequence
  icon: sunicon
  tab: sun
  after: sunlit
  requires: [sun2]
  replaces: sun2
  needs: [sunAge 3]
  days: 1
  sun: 0.93

- id: sun4
  name: Mature Sun
  icon: sunicon
  tab: sun
  after: sunlit
  requires: [sun3]
  replaces: sun3
  needs: [sunAge 4.5]
  days: 1
  sun: 1

- id: uv
  name: Ultraviolet
  icon: sunicon
  tab: sun
  after: life
  needs: [species 3, done sun2]
  days: 1
  dnaMult: {all: 1.25}

- id: solarwind
  name: Solar Wind
  icon: sunicon
  tab: sun
  after: cells
  requires: [ozonegas]
  needs: [done magnet]
  days: 2

# ======== Astronomy › Moon ========
# Its tides need open water; its pull slowly lengthens the day.

- id: tides
  name: Tides
  icon: wave
  tab: moon
  after: thaw
  needs: [water 15]
  days: 2
  iceShift: 2

- id: pools
  name: Tidal Pools
  icon: wave
  tab: moon
  after: thaw
  requires: [tides]
  needs: [water 30, minerals 50]
  days: 2
  boltMult: 2

- id: tilt
  name: Stable Tilt
  icon: wave
  tab: moon
  after: thaw
  requires: [pools]
  needs: [days 30]
  days: 3
  dieOff: 0.5

# ======== Astronomy › Stars ========
# The night sky shows nothing until the planet learns to look. Starlight lights the stars, Comets lets
# comets come, Star Signs lets their shapes be found, and Wandering Stars shows the planets.

- id: starlight
  name: Starlight
  icon: planet
  tab: stars
  needs: [days 2]
  days: 1

- id: cometsight
  name: Comets
  icon: planet
  tab: stars
  requires: [starlight]
  needs: [days 3]
  days: 1

- id: starsigns
  name: Star Signs
  icon: planet
  tab: stars
  requires: [starlight]
  needs: [days 6]
  days: 2

- id: wanderers
  name: Wandering Stars
  icon: planet
  tab: stars
  requires: [starsigns]
  needs: [signs 3]
  days: 2

