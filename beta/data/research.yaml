  needs: [oxygen 0.3]
  days: 1

# ======== Chemistry › Noble gases ========
# They react with nothing, so they do nothing to the climate. Each can exist as gas above its boiling point.
# Helium (uranium decay) and argon (potassium decay) come out with volcanic gas; radon seeps from moving crust
# and decays within days; neon, krypton and xenon arrive with comets and just stay. Helium escapes to space
# about as fast as decaying rock makes it; argon-40 builds up to about 0.93% of the air; radon has a 3.8-day half-life.

- id: helium
  name: Helium
  icon: cloud
  tab: noble
  needs: [temp -269, done volcano]
  days: 0.5

- id: neon
  name: Neon
  icon: cloud
  tab: noble
  needs: [temp -246, comets 1]
  days: 0.5

- id: argon
  name: Argon
  icon: cloud
  tab: noble
  needs: [temp -186, done volcano]
  days: 0.5

- id: krypton
  name: Krypton
  icon: cloud
  tab: noble
  needs: [temp -153, comets 2]
  days: 0.5

- id: xenon
  name: Xenon
  icon: cloud
  tab: noble
  needs: [temp -108, comets 3]
  days: 0.5

- id: radon
  name: Radon
  icon: cloud
  tab: noble
  needs: [temp -62, done plates]
  days: 0.5

# ======== Geology › Core ========
# The spinning iron inside. A steady spin makes it a dynamo.

- id: magnet
  name: Magnetic Field
  icon: vent
  tab: core
  needs: [spin 100]
  days: 1

# ======== Geology › Crust ========
# Volcanoes build land, plates move it (water helps them slide), collisions pile up mountains.
# Snow piles up on the peaks into glaciers; their meltwater and the rain run down as rivers, which fill hollows into lakes.

