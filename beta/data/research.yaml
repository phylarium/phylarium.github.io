- id: moonlight
  name: Moonlight
  icon: moonlight
  tab: moon
  after: sunlit
  needs: [night]
  days: 1

- id: circadian
  name: Circadian Rhythm
  icon: circadian
  tab: moon
  after: life
  requires: [moonlight]
  needs: [evolved cyano]
  days: 2

- id: predators
  name: Predators
  icon: predator
  tab: moon
  after: cells
  requires: [circadian]
  needs: [species 6, night]
  days: 2

- id: tilt
  name: Stable Tilt
  icon: tilt
  tab: moon
  after: thaw
  requires: [predators]
  needs: [days 30]
  days: 3
  dieOff: 0.5

- id: eclipse
  name: Eclipse
  icon: eclipse
  tab: moon
  ultra: true
  requires: [tilt]
  needs: [disaster hurricane, daytime]
  days: 3

