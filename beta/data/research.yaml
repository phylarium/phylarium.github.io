# ======== Science › Molecules ========
# Chemistry as a puzzle: a molecule shows once its atoms have been found, and is built from smaller molecules,
# as in real reactions. Then the gas can be set free in Atmosphere (thawN2, thawCH4, thawCO2) once warm enough.
#   H₂ = H + H             O₂ = O + O              N₂ = N + N
#   CO₂ = C + O₂ (burning) H₂O = 2H₂ + O₂          CH₄ = C + 2H₂        NH₃ = N₂ + 3H₂
#   O₃ = O₂ + O, made by sunlight once there is oxygen in the air (from life)
# Each is gained by its reaction puzzle (`reaction`: atom symbols and molecule ids; `makes`: how many come out):
# tap the right atoms and molecules into the slots.
# CH₄, NH₃, H₂ and H₂O are the molecules of the Miller–Urey experiment; with tidal pools they make RNA, and life needs RNA.

- id: mH2
  name: H₂
  title: Hydrogen
  icon: molH2
  tab: molecules
  requires: [cometsight]
  puzzle: reaction
  reaction: [H, H]
  needs: [set comets]
  days: 0.5

- id: mO2
  name: O₂
  title: Oxygen
  icon: molO2
  tab: molecules
  requires: [cometsight]
  puzzle: reaction
  reaction: [O, O]
  needs: [set comets]
  days: 0.5

- id: mN2
  name: N₂
  title: Nitrogen
  icon: molN2
  tab: molecules
  requires: [cometsight]
  puzzle: reaction
  reaction: [N, N]
  needs: [set comets]
  days: 0.5

- id: mCO2
  name: CO₂
  title: Carbon dioxide
  icon: molCO2
  tab: molecules
  puzzle: reaction
  reaction: [C, mO2]
  requires: [mO2]
  days: 1

- id: mH2O
  name: H₂O
  title: Water
  icon: molH2O
  tab: molecules
  puzzle: reaction
  reaction: [mH2, mH2, mO2]
  makes: 2
  requires: [mH2, mO2]
  days: 0.5

- id: mCH4
  name: CH₄
  title: Methane
  icon: molCH4
  tab: molecules
  puzzle: reaction
  reaction: [C, mH2, mH2]
  requires: [mH2]
  days: 0.5

- id: mNH3
  name: NH₃
  title: Ammonia
  icon: molNH3
  tab: molecules
  puzzle: reaction
  reaction: [mN2, mH2, mH2, mH2]
  makes: 2
  requires: [mN2, mH2]
  days: 0.5

# The first genes: RNA, a single strand that can copy itself, forms from the soup's molecules in tidal pools.
# Life needs it. DNA, the sturdier double strand, comes later (the Tides ultra).
- id: rna
  name: RNA
  icon: rnaStrand
  tab: cells
  puzzle: reaction
  reaction: [mCH4, mNH3, mH2O, mH2]
  requires: [mCH4, mNH3, mH2O, mH2]
  needs: [done pools]
  days: 1

# DNA: life copies its RNA genes into a sturdier double strand. Gained by pairing the bases of a second strand.
# The first cell: RNA wrapped in a skin of fatty molecules, which keeps the copying chemistry together.
# Life's soup is ready (the life event); researching this starts the first species.
- id: firstcell
  name: First Cell
  icon: cell
  tab: cells
  after: life
  requires: [rna]
  days: 1

- id: dna
  name: DNA
  icon: dnaHelix
  tab: cells
  puzzle: basepair
  evolveMult: {all: 1.5}
  after: cells
  requires: [rna, firstcell]
  needs: [evolved cyano]
  days: 1

- id: mO3
  name: O₃
  title: Ozone
  icon: molO3
  tab: molecules
  puzzle: reaction
  reaction: [mO2, O]
  after: cells
  requires: [mO2]
  needs: [oxygen 0.3]
  days: 1

