# ======== The molten heart (its poster) ========
# Magma (id lava): molten rock under the crust, the root of Restless Earth. Everything below grows from it: the
# spinning iron core's Magnetic Field (a steady spin makes it a dynamo), Volcanoes on land, Hydrothermal Vents on
# the sea floor, and Plate Tectonics (the churning mantle moves the plates).

- id: lava
  name: Magma
  icon: magma
  tab: core
  requires: [starlight]
  days: 0.5

# The young Earth was molten through. The heaviest stuff, iron and nickel, sank to the middle within a few tens of
# millions of years and made the core; the rock above it became the mantle, and the surface cooled into a thin crust.
- id: ironcore
  name: Iron Core
  icon: ironcore
  tab: core
  requires: [lava]
  days: 0.5

- id: mantle
  name: Mantle
  icon: mantle
  tab: core
  requires: [ironcore]
  days: 0.5

- id: crust
  name: Crust
  icon: crust
  tab: core
  requires: [mantle]
  days: 0.5

# Rotation is not researched: the player spins the planet (any time after Magma) until the spin locks, and then it
# is known. Until then it shows in the book as a blank card.
- id: rotation
  name: Rotation
  icon: rotation
  tab: core
  auto: true
  event: true
  requires: [lava]
  needs: [spin 100]

# The finale of The molten heart: a liquid iron core in a spinning planet is a dynamo. There is no puzzle, set or
# disaster in this story.
- id: magnet
  name: Magnetic Field
  icon: magnet
  tab: core
  ultra: true
  card: 'A core of liquid iron, turning with the planet, is a dynamo: its field shields the air from the solar wind.'
  requires: [ironcore, rotation] # an iron core, and a planet that turns
  days: 1

# ======== Restless Earth, Puzzle pieces, Rivers and ice ========
# Volcanoes build land, plates move it (water helps them slide), collisions pile up mountains.
# Snow piles up on the peaks into glaciers; their meltwater and the rain run down as rivers, which fill hollows into lakes.

- id: volcano
  name: Volcanoes
  icon: vent
  tab: volcanoes
  after: sunlit
  requires: [magnet]
  days: 0.5
  volcanoes: 5

# Volcanic gas: magma holds steam, CO₂ and sulfur dioxide (the toxic one, smelling of rotten eggs). Tapping a
# glowing volcano lets it breathe the gas out (CO₂ warms the planet), and argon comes out with it.
- id: volcgas
  name: Volcanic Gas
  icon: vent
  tab: volcanoes
  after: sunlit
  requires: [volcano]
  days: 0.5

# Eruptions: the gas expands as magma rises, like a shaken soda, until the volcano blasts out ash and sulfur
# haze that cool the planet for a while. From now on volcanoes erupt by themselves.
- id: eruption
  name: Eruptions
  icon: eruptionBig
