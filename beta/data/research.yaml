# ======== Science › Molecules ========
# Chemistry as a puzzle: a molecule shows once its atoms have been found, and is built from smaller molecules,
# as in real reactions. Then the gas can be set free in Atmosphere (thawN2, thawCH4, thawCO2) once warm enough.
#   H₂ = H + H             O₂ = O + O              N₂ = N + N
#   CO₂ = C + O₂ (burning) H₂O = 2H₂ + O₂          CH₄ = C + 2H₂        NH₃ = N₂ + 3H₂
#   O₃ = O₂ + O, made by sunlight once there is oxygen in the air (from life)
# Each is gained by its reaction puzzle (`reaction`: atom symbols and molecule ids; `makes`: how many come out):
# tap the right atoms and molecules into the slots.
# CH₄, NH₃, H₂ and H₂O are the molecules of the Miller–Urey experiment; with tidal pools they make RNA, and life needs RNA.

- id: mH2
  name: H₂
  icon: molH2
  tab: molecules
  requires: [milkyway]
  puzzle: reaction
  reaction: [H, H]
  needs: [atom H]
  days: 0.5

- id: mO2
  name: O₂
  icon: molO2
  tab: molecules
  requires: [milkyway]
  puzzle: reaction
  reaction: [O, O]
  needs: [matter O 2]
  days: 0.5

- id: mN2
  name: N₂
  icon: molN2
  tab: molecules
  requires: [milkyway]
  puzzle: reaction
  reaction: [N, N]
  needs: [matter N 2]
  days: 0.5

- id: mCO2
  name: CO₂
  icon: molCO2
  tab: molecules
  puzzle: reaction
  reaction: [C, mO2]
  requires: [mO2]
  needs: [matter C 3]
  days: 1

- id: mH2O
  name: H₂O
  icon: molH2O
  tab: molecules
  puzzle: reaction
  reaction: [mH2, mH2, mO2]
  makes: 2
  requires: [mH2, mO2]
  needs: [matter O 3]
  days: 0.5

- id: mCH4
  name: CH₄
  icon: molCH4
  tab: molecules
  puzzle: reaction
  reaction: [C, mH2, mH2]
  requires: [mH2]
  needs: [matter C 3]
  days: 0.5

- id: mNH3
  name: NH₃
  icon: molNH3
  tab: molecules
  puzzle: reaction
  reaction: [mN2, mH2, mH2, mH2]
  makes: 2
  requires: [mN2, mH2]
  days: 0.5

# The first genes: RNA, a single strand that can copy itself, forms from the soup's molecules in tidal pools.
# Life needs it. DNA, the sturdier double strand, comes later (the Tides ultra).
- id: rna
  name: RNA
  icon: rnaStrand
  tab: genes
  puzzle: reaction
  reaction: [mCH4, mNH3, mH2O, mH2]
  requires: [mCH4, mNH3, mH2O, mH2]
  needs: [done pools]
  days: 1

# DNA: life copies its RNA genes into a sturdier double strand. Gained by pairing the bases of a second strand.
# The first cell: RNA wrapped in a skin of fatty molecules, which keeps the copying chemistry together.
# Life's soup is ready (the life event); researching this starts the first species.
- id: firstcell
  name: First Cell
  icon: cell
  tab: genes
  after: life
  requires: [rna]
  days: 1

- id: dna
  name: DNA
  icon: dnaHelix
  tab: genes
  puzzle: basepair
  dnaMult: {all: 1.5}
  after: cells
  requires: [rna, firstcell]
  needs: [evolved cyano]
  days: 1

- id: mO3
  name: O₃
  icon: molO3
  tab: molecules
  puzzle: reaction
  reaction: [mO2, O]
  after: cells
  requires: [mO2]
  needs: [oxygen 0.3]
  days: 1

# ======== Science › Noble gases ========
# They react with nothing, so they do nothing to the climate. Each can exist as gas above its boiling point.
# Helium (uranium decay) and argon (potassium decay) come out with volcanic gas; radon seeps from moving crust
# and decays within days; neon, krypton and xenon arrive with comets and just stay. Helium escapes to space
# about as fast as decaying rock makes it; argon-40 builds up to about 0.93% of the air; radon has a 3.8-day half-life.

