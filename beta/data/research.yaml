# ======== Science › Noble gases ========
# They react with nothing, so they do nothing to the climate. Each can exist as gas above its boiling point.
# Helium (uranium decay) and argon (potassium decay) come out with volcanic gas; radon seeps from moving crust
# and decays within days; neon, krypton and xenon arrive with comets and just stay. Helium escapes to space
# about as fast as decaying rock makes it; argon-40 builds up to about 0.93% of the air; radon has a 3.8-day half-life.

- id: helium
  name: Helium
  icon: gasHelium
  tab: noble
  needs: [temp -269, done volcano]
  days: 0.5

- id: neon
  name: Neon
  icon: gasNeon
  tab: noble
  needs: [temp -246, comets 1]
  days: 0.5

- id: argon
  name: Argon
  icon: gasArgon
  tab: noble
  needs: [temp -186, done volcano]
  days: 0.5

- id: krypton
  name: Krypton
  icon: gasKrypton
  tab: noble
  needs: [temp -153, comets 2]
  days: 0.5

- id: xenon
  name: Xenon
  icon: gasXenon
  tab: noble
  needs: [temp -108, comets 3]
  days: 0.5

- id: radon
  name: Radon
  icon: gasRadon
  tab: noble
  needs: [temp -62, done plates]
  days: 0.5

# ======== Science › Spectrum ========
# Each visible color is found where nature first shows it; until then that color is drawn in grey.
# Yellow: the lit sun. Red: glowing lava. Orange: an eruption's fire fountain. Blue: air thick enough to
# scatter sunlight. Violet: the glow of lightning. Green: the first life that makes food from light.

- id: colorYellow
  name: Yellow
  icon: lightYellow
  tab: spectrum
  after: sunlit
  requires: [starlight]
  days: 0.5

- id: colorRed
  name: Red
  icon: lightRed
  tab: spectrum
  requires: [starlight]
  needs: [done lava]
  days: 0.5

- id: colorOrange
  name: Orange
  icon: lightOrange
  tab: spectrum
  requires: [starlight]
  needs: [eruptions 1]
  days: 0.5

- id: colorBlue
  name: Blue
  icon: lightBlue
  tab: spectrum
  requires: [starlight]
