# Stories: usually a minigame opens each, then research chapters in a logical order, then the natural disaster,
# itself a research node and the story's last chapter (researching it only adds a chance that it strikes), then an
# ultra-research: the story's finale, which makes facing the disaster worth while. Real process wins over the
# pattern: The molten heart has no minigame, disaster or set, and its chapters branch.
# The research `requires` chains follow these orders; this list names them and their disasters.
# The game loads this file; edit it and reload.
#
# Fields:
#   id, name
#   minigame   what the player does to open the story: its first chapter shows after the first win
#   quiet      no "A new story" splash when it opens: the moment on screen is enough
#              (MINIGAMES in game.js: twinkle, sunrise, plates, moonlit, moon, seeds, comets; spin and ignite open no
#              story but resolve the event cards Rotation and Ignition; ice brings the thaw; shine, river and cracks
#              come after a developed card, Evaporation, Snow Cap and Volcanoes, and change the world instead)
#   chapters   research ids in story order
#   disaster   the disaster: a research node (`disaster: true`) after the chapters, with the same id in disasters.yaml
#   ultra      the ultra-research after the disaster (research id, marked `ultra: true` in research.yaml)
#              A story can also hold a disaster and its ultra among its chapters (The water cycle: Flood, Fertile
#              Delta): an ultra answers the disaster it requires, wherever it sits.
#
# A story is a tree of research, shown as one on the Stories page. The research itself is done on the pages of the
# book (book.yaml), so a story runs across pages: each of its nodes leads to the page that holds it.

- id: stars
  name: A cow on the road
  minigame: twinkle
  quiet: true
  chapters: [starlight, starsight, nebulae]
  disaster: supernova
  ultra: milkyway

# The young Earth: molten, then layered, and spinning. Real process over pattern: no minigame opens it (Starlight
# does), no disaster and no set. Magma leads inward to the core, mantle and crust, and to Rotation (spin the
# planet until it locks); the iron core and Rotation together bring the Magnetic Field, its finale.
- id: core
  name: The molten heart
  chapters: [lava, crust, rotation]
  ultra: magnet

# No minigame opens it: Volcanoes is developed first, then the cracks glow (the cracks game raises the cones).
- id: earth
  name: Restless Earth
  chapters: [volcano, volcgas, eruption, supervolcano]
  disaster: supereruption
  ultra: richsoil

# The plates move apart, crash together and slip: the crust's own story, beside the volcanoes'. The world starts
# with one continent; its ultra splits it in two.
- id: plates
  name: Puzzle pieces
  minigame: plates
  chapters: [plates, collision, mountains, shallows, faults, vents]
  disaster: earthquake
  ultra: drift

# Opened by the sunrise game: a light glows behind the planet, and each tap lifts the sun until it stands in the
# sky. Then its event card, Ignition: tapping the risen sun until it lights, and its face plops out.
- id: sun
  name: The Sun
  minigame: sunrise
  chapters: [sunrise, ignition, uv, solarwind]
  disaster: solarstorm
  ultra: aurora

# Opened by the shine game: a ray from the tapped sun lands on open water and steams. The thaw (the ice game)
# must have come first: the ray needs open water.
# The whole cycle in one story: the sea steams, clouds, rain and snow, then the snow piles into glaciers whose
# meltwater runs as rivers into lakes. No minigame opens it: Evaporation is researched first, as the guide, and
# then a tap on the sun steams the sea (the shine game); Snow Cap likewise, then snow on a mountain caps it (the
# river game). Two branches: the currents from Evaporation, and the storms from Rain, which end in the hurricane
# and the rainbow. The wetlands, the flood and the delta need soil, so they are a story of Life (Living water).
- id: water
  name: The water cycle
  chapters: [evap, currents, clouds, rain, lightning, storms, snow, snowcap, glaciers, rivers, lakes]
  disaster: hurricane
  ultra: rainbow

- id: moonlight
  name: The cheese in the night
  minigame: moonlit
  quiet: true
  chapters: [moonphases, tilt, spring, summer, autumn, winter]
  disaster: iceage
  ultra: eclipse

# The foundation stories above end before life: space, geosphere, ocean and atmosphere stand at the origin of life
# (the Stone and water chapter's gate is their disasters). Tides has no disaster or finale of its own yet: the
# red tide and the glowing sea need algae, so they are a story of Life now (Blooming seas).
- id: tides
  name: Tides
  minigame: moon
  chapters: [tides, waves, pools]

# ======== Life ========
# The algae of the tidal pools bloom, poison the sea now and then, and light it up at night.
- id: algae
  name: Blooming seas
  chapters: [blooms]
  disaster: redtide
  ultra: biolum

# Lakes and soil make wetlands; the river floods them and leaves the fertile delta.
- id: marsh
  name: Living water
  chapters: [wetlands]
  disaster: flood
  ultra: delta

- id: green
  name: Green land
  minigame: seeds
  chapters: [soil, grass, forests, roots]
  disaster: drought
  ultra: superbloom

