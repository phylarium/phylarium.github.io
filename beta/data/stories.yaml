# Stories: usually a minigame opens each, then research chapters in a logical order, then the natural disaster,
# itself a research node and the story's last chapter (researching it only adds a chance that it strikes), then an
# ultra-research: the story's finale, which makes facing the disaster worth while. Real process wins over the
# pattern: The molten heart has no minigame, disaster or set, and its chapters branch.
# The research `requires` chains follow these orders; this list names them and their disasters.
# The game loads this file; edit it and reload.
#
# Fields:
#   id, name
#   minigame   what the player does to open the story: its first chapter shows after the first win
#              (MINIGAMES in game.js: twinkle, cracks, plates, ice, river, moonlit, moon, seeds, comets; spin
#              and ignite open no story but resolve the event cards Rotation and Ignition)
#   chapters   research ids in story order
#   disaster   the disaster: a research node (`disaster: true`) after the chapters, with the same id in disasters.yaml
#   ultra      the ultra-research after the disaster (research id, marked `ultra: true` in research.yaml)
#   posters    the story as posters in the poster book instead of a list: pictures of the phenomenon in
#              layers, one per concept. Its research is done by tapping them. A long story can take more than one
#              poster; each of its research is done on the poster that shows it. Each poster has:
#                section the poster's section id (listed under collections in book.yaml, named there)
#                art     the folder posters/<art>/: base.png, one <research id>.png per slot, and layers.json
#                        with each layer's place (tools/poster-placeholder.mjs draws stand-in art)
#                slots   { id, x, y }: a research id, and where on the poster it goes (percent of the width and
#                        height, its middle): a guide for the art, which decides the exact place. Every chapter,
#                        the disaster and the ultra need a slot on one of the story's posters. A slot may also
#                        show research from another story: it is researched there, and fills in here once known.

- id: stars
  name: A cow on the road
  minigame: twinkle
  chapters: [starlight, starsight, starcolors, nebulae, starsigns]
  disaster: supernova
  ultra: milkyway
  posters:
    - section: cow
      art: nightsky
      slots:
        # From Physics: researched there, shown here once known.
        - { id: starlight, x: 19, y: 76 }
        - { id: starsight, x: 18, y: 58 }
        - { id: starcolors, x: 45, y: 45 }
        - { id: nebulae, x: 28, y: 30 }
        - { id: starsigns, x: 76, y: 22 }
        - { id: supernova, x: 82, y: 60 }
        - { id: milkyway, x: 18, y: 10 }

# The young Earth: molten, then layered, and spinning. Real process over pattern: no minigame opens it (Starlight
# does), no disaster and no set. Magma leads inward to the core, mantle and crust, and to Rotation (spin the
# planet until it locks); the iron core and Rotation together bring the Magnetic Field, its finale.
- id: core
  name: The molten heart
  chapters: [lava, ironcore, mantle, crust, rotation]
  ultra: magnet
  posters:
    - section: molten
      art: earth
      slots:
        - { id: crust, x: 70, y: 30 }
        - { id: mantle, x: 66, y: 44 }
        - { id: lava, x: 60, y: 52 }
        - { id: ironcore, x: 52, y: 52 }
        - { id: rotation, x: 30, y: 50 }
        - { id: magnet, x: 18, y: 50 }

