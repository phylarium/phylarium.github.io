# The posters with research on them. Research is done on the pages of the science book (book.yaml); the one
# poster left is the Lab's molecules poster, where the chemistry puzzles are played by tapping a molecule.
# A poster is drawn as a picture in layers. The game loads this file; edit it and reload.
#
# Fields:
#   id      the poster's section id (named in book.yaml `sections`, listed under the lab subject there)
#   art     the folder posters/<art>/: base.png, one <slot id>.png per slot, and layers.json with each layer's
#           place (tools/poster-placeholder.mjs draws stand-in art)
#   night   true: black paper (the night sky) instead of cream
#   slots   { id, x, y }: what the layer shows, and where on the poster it goes (percent of the width and height,
#           its middle): a guide for the art, which decides the exact place. The id is research whose `tab` is
#           this poster. Every research whose tab is a poster has a slot on it (tools/check-data.mjs).

- id: molecules
  art: molecules
  slots:
    - { id: mH2, x: 26, y: 13 }
    - { id: mO2, x: 74, y: 13 }
    - { id: mN2, x: 26, y: 35 }
    - { id: mCO2, x: 74, y: 35 }
    - { id: mH2O, x: 26, y: 61 }
    - { id: mCH4, x: 74, y: 61 }
    - { id: mNH3, x: 26, y: 86 }
    - { id: mO3, x: 74, y: 86 }
