# The posters: the research interface. Each poster is one phenomenon, drawn as a picture in layers, and the
# research on it is done by tapping. A poster is cut by what belongs together in nature (the Sun, the Moon, the
# year, snow and ice), not by story: a story (stories.yaml) is a tree of research that may run across several
# posters, and the Stories page shows it as a tree whose nodes lead to the posters.
# The game loads this file; edit it and reload.
#
# Fields:
#   id      the poster's section id (named in book.yaml `sections`, listed under the collections subject there)
#   art     the folder posters/<art>/: base.png, one <slot id>.png per slot, and layers.json with each layer's
#           place (tools/poster-placeholder.mjs draws stand-in art)
#   night   true: black paper (the night sky) instead of cream
#   slots   { id, x, y }: what the layer shows, and where on the poster it goes (percent of the width and height,
#           its middle): a guide for the art, which decides the exact place. The id is research, or an item of a
#           collection (collections.yaml `poster: <this poster>`). Research whose `tab` is this poster is done
#           here. A slot may also show research from another poster or tab: it fills in here once known.
#           Every research whose tab is a poster has a slot on it (tools/check-data.mjs).

# ---------------- The sky ----------------

- id: stars
  art: stars
  night: true
  slots:
    - { id: starlight, x: 24, y: 82 } # from Physics: researched there, shown here once known
    - { id: starsight, x: 22, y: 60 }
    - { id: starcolors, x: 50, y: 46 }
    - { id: nebulae, x: 24, y: 30 }
    - { id: starsigns, x: 74, y: 28 }
    - { id: supernova, x: 80, y: 58 }
    - { id: milkyway, x: 40, y: 7 }

