# The tree of life. The game loads this file; edit it and reload.
#
# Fields:
#   id, name, desc   id is used in code and saves: never change a released id
#   icon             sprite name from sprites.js
#   domain           habitat: ocean, ground or atmosphere. Each opens with an event (ocean: cells, ground and
#                    atmosphere: ozone); flyers are listed with land life until the sky opens.
#   parent           species it evolves from
#   cost             DNA to evolve
#   dna, o2          per second at full population
#   green            share of land it greens (land plants)
#   temp             [min, max] global mean °C it can live in
#   home             climate zones a land species lives in (reef, wet, moist, dry, cold, fresh); its population
#                    can only fill as much as those zones allow, so spreading deserts or ice push it back
#   plenty           share of its zones that holds a full population (default 0.6); reef species need far less
#   research         research id that must be done before it can evolve
#   microbe          true: too small to show as a critter on the planet

