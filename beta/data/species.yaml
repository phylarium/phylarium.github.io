# The tree of life. The game loads this file; edit it and reload.
#
# Evolution runs by itself, one species at a time, each taking its days (evolveTick in game.js). A species evolves
# once the planet is ready for it: its parent at half its population, the habitat open, its own conditions (the
# cards in `needs`, such as Eyes), and a home that suits it (room in its zones, a temperature it can live in).
#
# Fields:
#   id, name, desc   id is used in code and saves: never change a released id
#   icon             sprite name from sprites.js
#   domain           habitat: ocean, ground or atmosphere. Each opens with an event (ocean: cells, ground and
#                    atmosphere: ozone); flyers are listed with land life until the sky opens.
#   parent           species it evolves from
#   days             game days it takes to evolve (default 1)
#   o2               oxygen per second at full population
#   green            share of land it greens (land plants)
#   temp             [min, max] °C it can live in, spot by spot: it lives only where its zones are this warm
#                    (the equator is about 14 °C over the planet's mean, the poles 30 under; zone-temps.js)
#   home             climate zones a land species lives in (reef, wet, moist, dry, cold, fresh); its population
#                    can only fill as much as those zones allow, so spreading deserts or ice push it back
#   plenty           share of its zones that holds a full population (default 0.6); reef species need far less
#   research         research id that must be done before it can evolve
#   needs            conditions like research has (e.g. evolved flower, impact: after the asteroid that ends
#                    the dinosaurs)
#   survivor         true: it can evolve from its parent after the parent died out (birds from the dinosaurs)
#   microbe          true: too small to show as a critter on the planet
#   flora            true: a plant, an alga or a fungus. It is found for the Flora page; every other species
#                    that is not a microbe is an animal, found for the Fauna page (data/collections.yaml)


