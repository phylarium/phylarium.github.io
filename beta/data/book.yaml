# The book: everything behind the four buttons, in one place. The game loads this file; edit it and reload.
#
# screens: what a button opens, in this order: the book, the lab, the computer (the terminal) and the settings.
#   id, name   the id is used in code; the name is the screen's title
#   color      the color of its title
#   pages      its pages, in order. The book and the lab are runs of pages, swiped left and right; the computer
#              and the settings have one page each.
# A page:
#   id, name   the name shows at the top of the page. A page shows once one of its sections has opened.
#   sections   its parts, stacked down the page in this order.
# A section:
#   id         used in code and by the other files: a research card's `tab` (research.yaml) and a collection's
#              `section` (collections.yaml) name the section they show in. The cards of a section show in the
#              order of research.yaml.
#   name       its heading on the page.
#   chapter    the chapter (chapters.yaml) the section belongs to: it stays hidden, and its research cannot be
#              done, until that chapter is reached. A section without one is never gated.
#   night      true: a dark panel for the night sky (a collection says `night: true` itself).
# When a section opens is code: SECTION_UNLOCKED in game.js; a section of research opens by itself once anything
# on it is known or can be researched, in a chapter that is reached.

screens:
  # The book: one page per sphere, its research sections and its card collections, then the stories.
  - id: book
    name: Book
    pages:
      - id: space
        name: Space
        sections:
          - { id: stars, name: The stars, chapter: fire }
          - { id: spectrum, name: The spectrum, chapter: fire }
          - { id: sun, name: The Sun, chapter: fire }
          - { id: moon, name: The Moon, chapter: fire }
          - { id: phases, name: Moon phases }
          - { id: year, name: The year, chapter: stone }
          - { id: comets, name: Comets }
          - { id: cometcards, name: Famous comets }
          - { id: signs, name: Star signs, night: true }
          - { id: planets, name: Planets, night: true }
          - { id: meteorites, name: Meteorites }
      - id: atmosphere
        name: Atmosphere
        sections:
          - { id: air, name: The air, chapter: stone }
          - { id: atmosphere, name: Atmosphere }
          - { id: airlife, name: Air life }
          - { id: noble, name: Noble gases }
          - { id: water, name: The water cycle, chapter: stone }
          - { id: storms, name: Storms, chapter: stone }
          - { id: snowflakes, name: Snowflakes }
          - { id: glows, name: Glowing gases }
          - { id: bands, name: Beyond the rainbow }
      - id: geosphere
        name: Geosphere
        sections:
          - { id: core, name: The molten heart, chapter: fire }
          - { id: volcanoes, name: Volcanoes, chapter: stone }
          - { id: plates, name: The plates, chapter: stone }
          - { id: gems, name: Gems of the plates }
          - { id: treasures, name: Deep treasures }
      - id: ocean
        name: Ocean
        sections:
          - { id: sea, name: The sea, chapter: stone }
          - { id: ice, name: Snow and ice, chapter: stone }
          - { id: rivers, name: Rivers and lakes, chapter: stone }
          - { id: lights, name: Lights of the sea }
      - id: stories
        name: Stories
        sections:
          - { id: stories, name: Stories }
          - { id: ultras, name: Ultras }
          - { id: disasters, name: Natural disasters }

  # The lab: chemistry (the periodic table, the molecule puzzles), physics (the Spectrum, the laws of nature,
  # the SI units) and biology.
  - id: lab
    name: Lab
    color: '#8ad8ff'
    pages:
      - id: chemistry
        name: Chemistry
        sections:
          - { id: elements, name: Periodic table }
          - { id: molecules, name: Molecules, chapter: stone }
      - id: physics
        name: Physics
        sections:
          - { id: colors, name: Spectrum }
          - { id: laws, name: Laws of nature }
          - { id: units, name: SI units }
      - id: biology
        name: Biology
        sections:
          - { id: cells, name: The first cells, chapter: life }
          - { id: sealife, name: Life in the sea, chapter: life }
          - { id: meadow, name: Green land, chapter: life }
          - { id: grasses, name: Wild grasses }
          - { id: flowers, name: Flowers and pollinators }
          - { id: land, name: Onto land, chapter: life }
          - { id: warm, name: Warm blood, chapter: life }
          - { id: life, name: Tree of life }
          - { id: index, name: Species }

  # The computer: the weather and the air as numbers and graphs of the last hour, and the state of land and sea.
  - id: climate
    name: Terminal
    color: '#ff9a5a'
    pages:
      - id: climate
        name: Terminal
        sections:
          - { id: climate, name: Climate }
          - { id: weather, name: Weather }
          - { id: ground, name: Land }
          - { id: seas, name: Ocean }
          - { id: skies, name: Atmosphere }
          - { id: cosmos, name: Space }

  # The settings.
  - id: game
    name: Game
    color: '#a09cc8'
    pages:
      - id: game
        name: Game
        sections:
          - { id: world, name: Game }
