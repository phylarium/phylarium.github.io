# The science book and the poster book. The game loads this file; edit it and reload.
#
# subjects: one tab (chapter) each, in this order, as colored squares with the sprite subject<Name>.
# A subject can split its page into headed groups: `groups` (each a name and sections) instead of `sections`.
# A group shows once one of its sections has opened.
# The page title uses the tab color, or `text` when the tab is too dark to read on the page.
# A subject marked hidden is not a tab of the science book: the game page (opened from the book's header), the
# computer (Climate, its own button) and the poster book (Collections, its own button).
# sections: the title of each section. When a section unlocks is code: SECTION_UNLOCKED in game.js; a poster
# (data/posters.yaml) opens by itself once anything on it is known or can be researched.
# night: sections drawn as dark card posters that carry no data of their own (the star signs and the planets);
# posters and collections say `night: true` themselves.

subjects:
  # Space: the sun, moon and stars are posters; Comets stays here.
  - id: space
    name: Space
    color: '#141220'
    text: '#f2f0ff'
    sections: [comets]

  # Climate: the weather and the air as numbers and graphs of the last hour, and the state of the land and sea.
  - id: climate
    name: Climate
    color: '#ff9a5a'
    sections: [temperature, weather, gases, surface]
    hidden: true

  # Atmosphere: the air's figures and the gases that thaw into it. The noble gases hide here until they have a use.
  - id: atmosphere
    name: Atmosphere
    color: '#5a8aff'
    sections: [atmosphere, airlife, noble]

  # Life: the tree of life and the species. The molecules, cells and traits are posters.
  - id: biology
    name: Life
    color: '#a0e05a'
    sections: [life, index]

  # The poster book: every poster (data/posters.yaml, in this order), then the card posters, swiped left and right.
  - id: collections
    name: Collections
    color: '#e8d8b0'
    sections:
      [stars, spectrum, sun, moon, year, visitors, core, volcanoes, plates, air, water, ice, storms, rivers, sea,
       meadow, molecules, cells, sealife, land, warm, phases, signs, cometcards, planets, units, laws, elements]
    hidden: true

  - id: stories
    name: Stories
    color: '#ffb43a'
    sections: [stories, ultras, disasters]

  - id: game
    name: Game
    color: '#a09cc8'
    sections: [world]
    hidden: true

night: [signs, planets]

