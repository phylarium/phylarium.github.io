# The science book and the poster book. The game loads this file; edit it and reload.
#
# subjects: one tab (chapter) each, in this order, as colored squares with the sprite subject<Name>.
# A subject can split its page into headed groups: `groups` (each a name and sections) instead of `sections`.
# A group shows once one of its sections has opened.
# The page title uses the tab color, or `text` when the tab is too dark to read on the page.
# A subject marked hidden is not a tab of the science book: the game page (the settings button), the computer
# (Climate, its own button), the poster book (Collections, its own button) and the Lab (its own button).
# sections: the title of each section. When a section unlocks is code: SECTION_UNLOCKED in game.js; a page of
# research opens by itself once anything on it is known or can be researched, in a chapter that is reached
# (data/chapters.yaml).
# night: sections drawn as dark card posters that carry no data of their own (the star signs and the planets);
# collections say `night: true` themselves.

subjects:
  # Space: the stars and the spectrum, the Sun, the Moon, the year, and what comes in from space.
  - id: space
    name: Space
    color: '#141220'
    text: '#f2f0ff'
    sections: [stars, spectrum, sun, moon, year, comets]

  # Geosphere: the molten heart, the volcanoes and the plates.
  - id: geosphere
    name: Geosphere
    color: '#b05a2a'
    sections: [core, volcanoes, plates]

  # Climate: the weather and the air as numbers and graphs of the last hour, and the state of the land and sea.
  - id: climate
    name: Terminal
    color: '#ff9a5a'
    sections: [calendar, climate, weather, ground, seas, skies, cosmos]
    hidden: true

  # Atmosphere: the air, its figures and the gases that thaw into it, and the life in it. The noble gases hide
  # here until they have a use.
  - id: atmosphere
    name: Atmosphere
    color: '#5a8aff'
    sections: [air, atmosphere, airlife, noble]

  # Ocean: the sea, the water cycle, snow and ice, storms, rivers and lakes.
  - id: ocean
    name: Ocean
    color: '#2a6ad0'
    sections: [sea, water, ice, storms, rivers]

  # Life: the first cells, life in the sea, green land, onto land, warm blood, the tree of life and the species.
  - id: biology
    name: Life
    color: '#a0e05a'
    sections: [cells, sealife, meadow, land, warm, life, index]

  # The poster book: every card set as a poster, swiped left and right.
  - id: collections
    name: Collections
    color: '#e8d8b0'
    sections:
      [colors, bands, glows, treasures, gems, snowflakes, grasses, flowers, lights, meteorites, phases, signs,
       cometcards, planets]
    hidden: true

  # The lab: chemistry (the molecule puzzles, the periodic table), physics (the laws of nature, the SI units) and
  # biology (the biology subject's pages, on the lab's Biology page).
  - id: lab
    name: Lab
    color: '#8ad8ff'
    sections: [molecules, elements, laws, units]
    hidden: true

  - id: stories
    name: Stories
    color: '#ffb43a'
    sections: [stories, ultras, disasters]

  - id: game
    name: Game
    color: '#a09cc8'
    sections: [world]
    hidden: true

# The book's pages and the lab's, swiped left and right. A page is one sphere: its research sections (what is
# found on them) and its card collections, stacked down the page under the page's name. A page shows once one of
# its sections has opened.
pages:
  book:
    - name: Space
      sections: [stars, spectrum, colors, sun, moon, phases, year, comets, cometcards, signs, planets, meteorites]
    - name: Atmosphere
      sections: [air, atmosphere, airlife, noble, water, storms, snowflakes, glows, bands]
    - name: Geosphere
      sections: [core, volcanoes, plates, gems, treasures]
    - name: Ocean
      sections: [sea, ice, rivers, lights]
    - name: Stories
      sections: [stories, ultras, disasters]
  lab:
    - name: Chemistry
      sections: [elements, molecules]
    - name: Physics
      sections: [laws, units]
    - name: Biology
      sections: [cells, sealife, meadow, grasses, flowers, land, warm, life, index]

night: [signs, planets]

sections:
  # Space
  stars: The stars
  spectrum: The spectrum
  sun: The Sun
  moon: The Moon
  year: The year
  comets: Comets
  # Geosphere
  core: The molten heart
  volcanoes: Volcanoes
  plates: The plates
  # Atmosphere
  air: The air
  atmosphere: Atmosphere
  airlife: Air life
  noble: Noble gases
  # Ocean
  sea: The sea
  water: The water cycle
  ice: Snow and ice
  storms: Storms
  rivers: Rivers and lakes
  # Life
  cells: The first cells
  sealife: Life in the sea
  meadow: Green land
  land: Onto land
  warm: Warm blood
  life: Tree of life
  index: Species
  # Card posters
  colors: Spectrum
  bands: Beyond the rainbow
  glows: Glowing gases
  treasures: Deep treasures
  gems: Gems of the plates
  snowflakes: Snowflakes
  grasses: Wild grasses
  flowers: Flowers and pollinators
  lights: Lights of the sea
  meteorites: Meteorites
  phases: Moon phases
  signs: Star signs
  cometcards: Famous comets
  planets: Planets
  units: SI units
  laws: Laws of nature
  # The lab
  molecules: Molecules
  elements: Periodic table
  # The rest
  stories: Stories
  ultras: Ultras
  disasters: Natural disasters
  calendar: Calendar
  climate: Climate
  weather: Weather
  ground: Land
  seas: Ocean
  skies: Atmosphere
  cosmos: Space
