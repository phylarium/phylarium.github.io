# The science book. The game loads this file; edit it and reload.
#
# subjects: one tab (chapter) each, in this order, as colored squares with the sprite subject<Name>.
# The page title uses the tab color, or `text` when the tab is too dark to read on the page.
# A subject marked hidden is not a tab (the game page, opened from the book's header).
# sections: the title of each section. When a section unlocks is code: SECTION_UNLOCKED in game.js.

subjects:
  - id: space
    name: Space
    color: '#141220'
    text: '#f2f0ff'
    sections: [sun, moon, stars, comets, signs, planets]

  - id: atmosphere
    name: Atmosphere
    color: '#5a8aff'
    sections: [atmosphere, airlife]

  - id: mountains
    name: Mountains
    color: '#b07a4a'
    sections: [land]

  - id: land
    name: Land
    color: '#6ee07a'
    sections: [freshwater, landlife]

  - id: ocean
    name: Ocean
    color: '#5ad8e8'
    sections: [ocean, oceanlife]

  - id: core
    name: Core
    color: '#ff5a4a'
    sections: [core]

  # Science holds what the player has discovered: chemistry, physics, math and biology.
  - id: science
    name: Science
    color: '#ff8ad8'
    sections: [elements, molecules, noble, laws, life, index, disasters]

  - id: game
    name: Game
    color: '#a09cc8'
    sections: [world]
    hidden: true

sections:
  core: Core
  land: Crust
  freshwater: Rivers and lakes
  moon: Moon
  sun: Sun
  atmosphere: Atmosphere
  noble: Noble gases
  ocean: Ocean
  oceanlife: Ocean life
  landlife: Land life
  airlife: Air life
  life: Tree of life
  elements: Periodic table
  laws: Laws of nature
  stars: Stars
  comets: Comets
  molecules: Molecules
  disasters: Natural disasters
  signs: Star signs
  planets: Planets
  index: Species
  world: Game
