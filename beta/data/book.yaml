# The science book. The game loads this file; edit it and reload.
#
# subjects: one tab each, in this order (colored squares, spectrum order). `sections` lists its pages.
# A subject marked hidden is not a tab (the game page, opened from the book's header).
# sections: the title of each section. When a section unlocks is code: SECTION_UNLOCKED in game.js.

subjects:
  - id: math
    name: Math
    color: '#ff5a4a'
    sections: []

  - id: physics
    name: Physics
    color: '#ffa03a'
    sections: [laws]

  - id: astronomy
    name: Astronomy
    color: '#ffe04a'
    sections: [sun, moon, stars, comets, signs, planets]

  - id: biology
    name: Biology
    color: '#6ee07a'
    sections: [life, index, oceanlife, landlife, airlife]

  - id: oceanography
    name: Oceanography
    color: '#5a8aff'
    sections: [ocean]

  - id: chemistry
    name: Chemistry
    color: '#b07aff'
    sections: [elements, molecules, noble]

  - id: geology
    name: Geology
    color: '#b07a4a'
    sections: [core, land, atmosphere, disasters]

  - id: sociology
    name: Sociology
    color: '#ff8ad8'
    sections: []

  - id: game
    name: Game
    color: '#a09cc8'
    sections: [world]
    hidden: true

sections:
  core: Core
  land: Crust
  moon: Moon
  sun: Sun
  atmosphere: Atmosphere
  noble: Noble gases
  ocean: Ocean
  oceanlife: Ocean life
  landlife: Land life
  airlife: Air life
  life: Tree of life
  elements: Periodic table
  laws: Laws of nature
  stars: Stars
  comets: Comets
  molecules: Molecules
  disasters: Natural disasters
  signs: Star signs
  planets: Planets
  index: Species
  world: Game
