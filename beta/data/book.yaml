# The science book. The game loads this file; edit it and reload.
#
# subjects: one tab (chapter) each, in this order, as colored squares with the sprite subject<Name>.
# A subject can split its page into headed groups: `groups` (each a name and sections) instead of `sections`.
# A group shows once one of its sections has opened.
# The page title uses the tab color, or `text` when the tab is too dark to read on the page.
# A subject marked hidden is not a tab of the science book: the game page (opened from the book's header), the
# computer (Climate, its own button) and the poster book (Collections, its own button).
# sections: the title of each section. When a section unlocks is code: SECTION_UNLOCKED in game.js.

subjects:
  # Space: the sun, moon and stars are posters now; Comets stays here.
  - id: space
    name: Space
    color: '#141220'
    text: '#f2f0ff'
    sections: [comets]

  # Physics: light first (the first research of all). The units and the laws of nature are posters.
  - id: physics
    name: Physics
    color: '#ffe08a'
    sections: [light]

  # Climate: the weather and the air as numbers and graphs of the last hour, and the state of the land and sea.
  - id: climate
    name: Climate
    color: '#ff9a5a'
    sections: [temperature, weather, gases, surface]
    hidden: true

  - id: atmosphere
    name: Atmosphere
    color: '#5a8aff'
    sections: [atmosphere, airlife]

  - id: ocean
    name: Ocean
    color: '#5ad8e8'
    sections: [oceanlife]

  # Life: biology, from the genes to the tree of life and the species.
  - id: biology
    name: Life
    color: '#a0e05a'
    sections: [genes, traits, life, index]

  # Science holds chemistry, and math later.
  - id: science
    name: Science
    color: '#ff8ad8'
    groups:
      - name: Chemistry
        sections: [molecules, noble]
      - name: Math
        sections: []

  # Collections: every set as a poster of its own, swiped left and right. Night-sky sets are dark posters.
  - id: collections
    name: Collections
    color: '#e8d8b0'
    sections:
      [cow, molten, restless, tectonics, solar, watercycle, storms, riversice, cheese, seashore, greenland, visitors, electromagnetism, spectrum, bands, units, laws, elements, glow, snowflakes, treasures, gems, grasses, flowers, lights, phases, signs, planets,
       meteorites, cometcards]
    hidden: true

  - id: stories
    name: Stories
    color: '#ffb43a'
    sections: [stories, ultras, disasters]

  - id: game
    name: Game
    color: '#a09cc8'
    sections: [world]
    hidden: true

sections:
