# Stories: a minigame opens each, then research chapters in a logical order, then the natural disaster, itself a
# research node and the story's last chapter (researching it only adds a chance that it strikes), then an
# ultra-research: the story's finale, which makes facing the disaster worth while.
# The research `requires` chains follow these orders; this list names them and their disasters.
# The game loads this file; edit it and reload.
#
# Fields:
#   id, name
#   minigame   what the player does to open the story: its first chapter shows after the first win
#              (MINIGAMES in game.js: twinkle, spin, ignite, ice, river, moonlit, moon, seeds, comets, plates)
#   chapters   research ids in story order
#   disaster   the disaster: a research node (`disaster: true`) after the chapters, with the same id in disasters.yaml
#   ultra      the ultra-research after the disaster (research id, marked `ultra: true` in research.yaml)
#   poster     (trying it out on one story) the story as a poster among the Collections instead of a list: a
#              picture of the phenomenon in layers, one per concept. Its research is done by tapping them.
#                section the poster's section id (listed under collections in book.yaml, named there)
#                art     the folder posters/<art>/: base.png, one <research id>.png per slot, and layers.json
#                        with each layer's place (tools/poster-placeholder.mjs draws stand-in art)
#                slots   { id, x, y }: a research id, and where on the poster it goes (percent of the width and
#                        height, its middle): a guide for the art, which decides the exact place. Every chapter,
#                        the disaster and the ultra need a slot. A slot may also show research from another
#                        story: it is researched there, and fills in here once known.

- id: stars
  name: A cow on the road
  minigame: twinkle
  chapters: [starlight, starsight, starcolors, nebulae, starsigns]
  disaster: supernova
  ultra: milkyway

# The young Earth: molten, then layered, then spun. Real process over pattern: no minigame opens it (Starlight
# does), no disaster and no set; spinning the planet brings Rotation, and then the Magnetic Field, its finale.
- id: core
  name: The molten heart
  chapters: [lava, ironcore, mantle, crust, rotation]
  ultra: magnet
  poster:
    section: molten
    art: earth
    slots:
      - { id: crust, x: 70, y: 30 }
      - { id: mantle, x: 66, y: 44 }
      - { id: lava, x: 60, y: 52 }
      - { id: ironcore, x: 52, y: 52 }
      - { id: rotation, x: 30, y: 50 }
      - { id: magnet, x: 18, y: 50 }

- id: earth
  name: Restless Earth
  minigame: cracks
  chapters: [volcano, volcgas, eruption, lavafields, supervolcano]
  disaster: supereruption
  ultra: richsoil

# The plates move apart, crash together and slip: the crust's own story, beside the volcanoes'. The world starts
# with one continent; its ultra splits it in two.
- id: plates
  name: Puzzle pieces
  minigame: plates
  chapters: [plates, collision, mountains, shallows, faults, vents]
  disaster: earthquake
  ultra: drift

# Opened by its event card, Ignition: tapping the dark sun until it lights.
- id: sun
  name: The Sun
  chapters: [ignition, sun2, uv, solarwind, ozonegas]
  disaster: solarstorm
  ultra: aurora

- id: water
  name: The water cycle
  minigame: ice
  chapters: [currents, evap, clouds, rain, snow, lightning, storms, hail]
  disaster: hurricane
  ultra: rainbow
  poster:
    section: watercycle
    art: water
    slots:
      - { id: currents, x: 80, y: 86 }
      - { id: evap, x: 84, y: 60 }
      - { id: clouds, x: 58, y: 30 }
      - { id: rain, x: 52, y: 54 }
      - { id: snow, x: 20, y: 14 }
      - { id: lightning, x: 38, y: 32 }
      - { id: storms, x: 40, y: 10 }
      - { id: hail, x: 62, y: 9 }
      - { id: hurricane, x: 88, y: 34 }
      - { id: rainbow, x: 68, y: 52 }
      # From Rivers and ice: researched there, shown here once known.
      - { id: glaciers, x: 16, y: 40 }
      - { id: rivers, x: 32, y: 66 }
      - { id: lakes, x: 14, y: 76 }

- id: rivers
  name: Rivers and ice
  minigame: river
  chapters: [glaciers, rivers, lakes, wetlands]
  disaster: flood
  ultra: delta

- id: moonlight
  name: The cheese in the night
  minigame: moonlit
  chapters: [moonlight, moonphases, tilt, seasons, circadian]
  disaster: iceage
  ultra: eclipse

- id: tides
  name: Tides
  minigame: moon
  chapters: [tides, waves, pools, blooms]
  disaster: redtide
  ultra: biolum

- id: green
  name: Green land
  minigame: seeds
  chapters: [soil, grass, forests, roots]
  disaster: drought
  ultra: superbloom

- id: space
  name: Visitors from space
  minigame: comets
  chapters: [cometpaths, orbits, asteroids]
  disaster: asteroid
  ultra: meteors
