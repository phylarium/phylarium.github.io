# The science book. The game loads this file; edit it and reload.
#
# subjects: one tab (chapter) each, in this order, as colored squares with the sprite subject<Name>.
# A subject can split its page into headed groups: `groups` (each a name and sections) instead of `sections`.
# A group shows once one of its sections has opened.
# The page title uses the tab color, or `text` when the tab is too dark to read on the page.
# A subject marked hidden is not a tab (the game page, opened from the book's header).
# sections: the title of each section. When a section unlocks is code: SECTION_UNLOCKED in game.js.

subjects:
  - id: space
    name: Space
    color: '#141220'
    text: '#f2f0ff'
    sections: [sun, moon, stars, comets]

  # Physics: light first (the first research of all). The units and the laws of nature are posters.
  - id: physics
    name: Physics
    color: '#ffe08a'
    sections: [light]

  # Climate: the weather and the air as numbers and graphs of the last hour.
  - id: climate
    name: Climate
    color: '#ff9a5a'
    sections: [temperature, weather, gases]

  - id: atmosphere
    name: Atmosphere
    color: '#5a8aff'
    sections: [atmosphere, airlife]

  # The solid planet, from the core out to the crust: all of Restless Earth on one tab.
  - id: geosphere
    name: Geosphere
    color: '#b07a4a'
    sections: [core, land]

  - id: land
    name: Land
    color: '#6ee07a'
    sections: [freshwater, landlife]

  - id: ocean
    name: Ocean
    color: '#5ad8e8'
    sections: [ocean, tides, oceanlife]

  # Life: biology, from the genes to the tree of life and the species. The first cell will move here too.
  - id: biology
    name: Life
    color: '#a0e05a'
    sections: [genes, traits, life, index]

  # Science holds chemistry, and math later.
  - id: science
    name: Science
    color: '#ff8ad8'
    groups:
      - name: Chemistry
        sections: [molecules, noble]
      - name: Math
        sections: []

  # Collections: every set as a poster of its own, swiped left and right. Night-sky sets are dark posters.
  - id: collections
    name: Collections
    color: '#e8d8b0'
    sections:
      [molten, watercycle, spectrum, electromagnetism, bands, units, laws, elements, glow, snowflakes, treasures, gems, grasses, flowers, lights, phases, signs, planets,
       meteorites, cometcards]

  - id: stories
    name: Stories
    color: '#ffb43a'
    sections: [stories, ultras, disasters]

  - id: game
    name: Game
    color: '#a09cc8'
    sections: [world]
    hidden: true

sections:
  core: Core
  land: Crust
  treasures: Deep treasures
  gems: Gems of the plates
  freshwater: Rivers and lakes
  moon: Moon
  sun: Sun
  atmosphere: Atmosphere
  glow: Glowing gases
  snowflakes: Snowflakes
  watercycle: The water cycle
  molten: The molten heart
  noble: Noble gases
  ocean: Ocean
  tides: Tides
  oceanlife: Ocean life
  lights: Lights of the sea
  landlife: Land life
  grasses: Wild grasses
  flowers: Flowers and pollinators
  meteorites: Meteorites
  airlife: Air life
  stories: Stories
  genes: Genes
  traits: Traits
  life: Tree of life
  elements: Periodic table
  laws: Laws of nature
  phases: Moon phases
  units: SI units
  light: Light
  spectrum: Spectrum
  bands: Beyond the rainbow
  electromagnetism: Electromagnetism
  stars: Stars
  comets: Comets
  cometcards: Famous comets
  ultras: Ultras
  molecules: Molecules
